<!DOCTYPE html> 
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aitor Cavero | Filmmaker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://wsrv.nl">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES & RESET --- */
        :root {
            --bg-color: #0b0d10;
            --bg-video-stack: #0b0d10;
            --bg-raised: #16181d;
            --text-main: #f3f1ec;
            --text-muted: #8b8e94;
            --accent-color: #ff7a3d;
            --accent-2: #3d8bff;
            --shadow-subtle: 0 12px 30px rgba(0, 0, 0, 0.35);
            --shadow-colored: 0 20px 40px rgba(255, 122, 61, 0.2);
            --radius-lg: 20px;
            --radius-md: 12px;
            --font-main: 'Manrope', sans-serif;
            --font-display: 'Anton', sans-serif;
            --transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- TYPOGRAPHY --- */
        h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1;
            text-transform: uppercase;
        }
        
        h1::after {
            content: '.';
            color: var(--accent-color);
        }
        
        h2 { font-size: 1.4rem; font-weight: 500; letter-spacing: -0.01em; }
        p { font-size: 1rem; color: var(--text-muted); line-height: 1.6; }
        
        a { text-decoration: none; color: inherit; transition: var(--transition); }
        a:hover { color: var(--accent-color); }

        /* --- HEADER --- */
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            mix-blend-mode: difference;
            color: white; 
        }

        .logo { font-weight: 700; font-size: 1.1rem; letter-spacing: 0.05em; text-transform: uppercase; }
        
        nav ul { list-style: none; }
        nav a { font-weight: 500; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }

        /* --- SCROLL VIDEO SECTION --- */
        .scroll-video-container {
            height: 1000vh;
            position: relative;
            background-color: var(--bg-video-stack); 
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #hero-lightpass {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

        @media (orientation: portrait) {
            #hero-lightpass { object-fit: contain; }
        }

        /* --- SECTIONS TITLES --- */
        .section-title {
            padding: 12vh 5% 4vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* --- PORTFOLIO GRID (VIDEOS) --- */
        .portfolio {
            padding: 0 5% 10vh;
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 3.5rem; 
            position: relative;
            z-index: 10;
        }

        .project-item {
            position: relative;
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px);
            transition: var(--transition);
        }

        .thumb-container {
            width: 100%;
            overflow: hidden;
            position: relative;
            background: var(--bg-raised);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-subtle);
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .ratio-horizontal { padding-bottom: 56.25%; }
        .ratio-vertical { padding-bottom: 125%; }

        .project-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: var(--transition);
        }

        .play-btn {
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 1rem 2.2rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: var(--transition);
        }

        .project-item:hover .thumb-container {
            transform: translateY(-8px);
            box-shadow: var(--shadow-colored);
            border-color: rgba(255, 122, 61, 0.2);
        }
        
        .project-item:hover .project-img { transform: scale(1.04); }
        .project-item:hover .overlay { opacity: 1; }
        .project-item:hover .play-btn { 
            background: #ffffff; 
            color: var(--accent-color); 
        }

        .project-info {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .project-cat {
            font-size: 0.75rem;
            color: var(--accent-2);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* --- GALLERY MASONRY --- */
        .gallery-container {
            padding: 0 5% 10vh;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Grid tipo masonry: cada foto reserva EXACTAMENTE su propia proporción real
           (el JS calcula cuántas filas ocupa), así que ninguna imagen se recorta.
           Las horizontales ocupan 2 columnas para tener más protagonismo. */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: 10px;
            grid-auto-flow: dense;
            gap: 1.25rem;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            display: block;
            transition: var(--transition);
            opacity: 0;
            transform: translateY(30px);
            box-shadow: var(--shadow-subtle);
            border: 1px solid rgba(255,255,255,0.06);
            grid-column: span 1;
        }

        .gallery img.wide {
            grid-column: span 2;
        }

        .gallery img:hover {
            transform: translateY(-5px) scale(1.01) !important;
            box-shadow: var(--shadow-colored);
            z-index: 2;
        }

        /* --- PRELOADER --- */
        body.loading { overflow: hidden; }
        
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.8s;
        }
        
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loader-text {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-main);
        }
        
        .loader-progress {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        
        /* --- ESTILOS EXTRA PARA LA GALERÍA Y VISOR --- */
        .gallery-img { cursor: pointer; }

        .modal-image-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-image-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--radius-md);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: zoomIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* --- MODAL --- */
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11, 13, 16, 0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal.active { opacity: 1; pointer-events: all; }

        .video-container {
            width: 80%;
            max-width: 1400px;
            background: #000;
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.2);
        }

        .close-modal {
            position: absolute;
            top: 2rem; right: 2.5rem;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-main);
            z-index: 2001;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            background: rgba(255,255,255,0.08);
            padding: 10px 20px;
            border-radius: 50px;
            transition: var(--transition);
        }

        .close-modal:hover {
            background: var(--accent-color);
            color: #ffffff;
        }

        footer {
            padding: 4rem 5% 4rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .reveal { opacity: 1 !important; transform: translateY(0) !important; }

        @media (max-width: 1024px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .portfolio { grid-template-columns: 1fr; gap: 3rem; }
            .gallery { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
        }
    </style>
</head>

<script>
/* --- LÓGICA DE SECUENCIA DE IMÁGENES --- */
const canvas = document.getElementById("hero-lightpass");
const context = canvas.getContext("2d");
const container = document.querySelector(".scroll-video-container");

canvas.width = 1280; 
canvas.height = 720;

const frameCount = 811; 
const images = new Array(frameCount + 1);
const preloader = document.getElementById('preloader');
const progressText = document.getElementById('progress-text');
const phrasesText = document.getElementById('loading-phrases');
let loadedFramesCount = 0;

function checkLoadProgress() {
    loadedFramesCount++;
    let percent = Math.floor((loadedFramesCount / frameCount) * 100);
    if (percent > 100) percent = 100;
    
    progressText.innerText = percent + '%';
    
    // Actualizamos la frase vinculada directamente al porcentaje real
    if (percent < 20) {
        phrasesText.innerText = "Preparando web...";
    } else if (percent < 40) {
        phrasesText.innerText = "Optimizando experiencia...";
    } else if (percent < 60) {
        phrasesText.innerText = "Renderizando píxeles...";
    } else if (percent < 85) {
        phrasesText.innerText = "Ajustando etalonaje...";
    } else if (percent < 100) {
        phrasesText.innerText = "Ya casi lo tenemos...";
    } else {
        phrasesText.innerText = "¡Todo listo!";
    }

    // Cuando llegamos a la totalidad de los frames, ocultamos el preloader
    if (loadedFramesCount === frameCount) {
        setTimeout(() => {
            preloader.classList.add('hidden');
            document.body.classList.remove('loading');
        }, 400); // Pequeño delay estético antes de desvanecer
    }
}

function loadFrame(index) {
    if (!images[index]) {
        const img = new Image();
        img.src = `img/frame_${index.toString().padStart(3, '0')}.webp`;
        images[index] = img;
        
        img.onload = () => {
            if (index === 1) context.drawImage(img, 0, 0, canvas.width, canvas.height);
            checkLoadProgress();
        };
        // Si una imagen falla por red, sumamos igual para que la web no se quede bloqueada
        img.onerror = () => checkLoadProgress(); 
        
        return img;
    }
    return images[index];
}

// Cargar TODOS los frames requeridos y bloquear la web hasta que terminen
for (let i = 1; i <= frameCount; i++) {
    loadFrame(i);
}

let currentIndex = 0;
let targetIndex = 0;

window.addEventListener('scroll', () => {
    const sectionTop = container.offsetTop;
    const walk = container.scrollHeight - window.innerHeight;
    
    let scrollFraction = (window.scrollY - sectionTop) / walk;
    if (scrollFraction < 0) scrollFraction = 0;
    if (scrollFraction > 1) scrollFraction = 1;

    const slowFrameStart = 710; 
    const scrollSplitPoint = 0.5; 

    if (scrollFraction <= scrollSplitPoint) {
        let phaseFraction = scrollFraction / scrollSplitPoint;
        targetIndex = phaseFraction * slowFrameStart;
    } else {
        let phaseFraction = (scrollFraction - scrollSplitPoint) / (1 - scrollSplitPoint);
        targetIndex = slowFrameStart + phaseFraction * (frameCount - 1 - slowFrameStart);
    }
});

function updateCanvas() {
    currentIndex += (targetIndex - currentIndex) * 0.04;
    const drawIndex = Math.round(currentIndex);

    if (images[drawIndex] && images[drawIndex].complete) {
        context.drawImage(images[drawIndex], 0, 0, canvas.width, canvas.height);
    }
    requestAnimationFrame(updateCanvas);
}
updateCanvas();

/* --- APPEAR ON SCROLL --- */
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('reveal');
    });
}, { threshold: 0.1 });

document.querySelectorAll('.project-item, .reveal-item').forEach(item => observer.observe(item));

/* --- MODALES DE VIDEO --- */
const modal = document.getElementById('videoModal');
const modalContainer = document.getElementById('modalContainer');

// Modal para Vimeo
function openModal(vimeoId, format) {
    modal.classList.add('active');
    if (format === 'vertical') {
        modalContainer.style.aspectRatio = '9/16';
        modalContainer.style.height = '85vh';
        modalContainer.style.width = 'auto';
    } else {
        modalContainer.style.aspectRatio = '16/9';
        modalContainer.style.width = '80%';
        modalContainer.style.height = 'auto';
    }
    modalContainer.innerHTML = `<iframe src="https://player.vimeo.com/video/${vimeoId}?autoplay=1&color=4353ff&title=0&byline=0&portrait=0" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
}

// Modal para YouTube Shorts / Videos
function openYouTubeModal(videoId) {
    modal.classList.add('active');
    modalContainer.style.aspectRatio = '9/16';
    modalContainer.style.height = '85vh';
    modalContainer.style.width = 'auto';
    modalContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>`;
}

// Modal para Instagram Reels (Visor integrado en la web)
function openInstagramModal(reelId) {
    modal.classList.add('active');
    modalContainer.style.aspectRatio = '9/16';
    modalContainer.style.height = '85vh';
    modalContainer.style.width = 'auto';
    modalContainer.style.backgroundColor = '#ffffff'; // Fondo blanco interno para el embed
    modalContainer.innerHTML = `<iframe src="https://www.instagram.com/reel/${reelId}/embed/" style="position:absolute;top:0;left:0;width:100%;height:100%;" frameborder="0" scrolling="no" allowtransparency="true" allowfullscreen></iframe>`;
}

function closeModal() {
    modal.classList.remove('active');
    setTimeout(() => { 
        modalContainer.innerHTML = ''; 
        modalContainer.style.backgroundColor = ''; // Limpiamos el fondo del modal por si el próximo es negro
    }, 400);
}

modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

/* --- THUMBNAILS VIMEO --- */
async function loadVimeoThumbs() {
    const imgs = document.querySelectorAll('[data-vimeo-id]');
    imgs.forEach(async img => {
        const id = img.getAttribute('data-vimeo-id');
        try {
            const res = await fetch(`https://vimeo.com/api/v2/video/${id}.json`);
            const data = await res.json();
            img.src = data[0].thumbnail_large;
        } catch (err) { 
            console.error("Error cargando thumbnail de Vimeo", err);
        }
    });
}
loadVimeoThumbs();

/* --- AUTOMATIZACIÓN DE MINIATURAS (CDN AL VUELO) Y LIGHTBOX PARA IMÁGENES --- */
// Masonry sin recortes: cada foto reserva exactamente las filas de grid que
// necesita según su proporción REAL, así ninguna imagen se corta jamás.
const MASONRY_ROW = 10; // debe coincidir con grid-auto-rows en CSS
const MASONRY_GAP = 20; // debe coincidir con "gap" del .gallery en CSS (1.25rem)

function setMasonrySpan(img) {
    if (!img.naturalWidth || !img.naturalHeight) return;
    if (img.naturalWidth > img.naturalHeight * 1.15) img.classList.add('wide');

    const renderedWidth = img.getBoundingClientRect().width;
    if (!renderedWidth) return;
    const renderedHeight = renderedWidth * (img.naturalHeight / img.naturalWidth);
    const rowSpan = Math.ceil((renderedHeight + MASONRY_GAP) / (MASONRY_ROW + MASONRY_GAP));
    img.style.gridRowEnd = `span ${rowSpan}`;
}

document.addEventListener("DOMContentLoaded", async () => {
    // Cada galería (Galería / Automoción) se reordena por separado
    const galleries = document.querySelectorAll('.gallery');

    for (const container of galleries) {
        const imgs = Array.from(container.querySelectorAll('img[data-highres]'));
        if (!imgs.length) continue;

        // Antes de maquetar necesitamos saber la orientación REAL de cada foto,
        // así que precargamos la miniatura de todas (son ligeras: 600px webp)
        await Promise.all(imgs.map(img => new Promise(resolve => {
            const highResUrl = img.getAttribute('data-highres');
            const cleanUrl = highResUrl.replace(/^https?:\/\//, '');
            const thumbnailUrl = `https://wsrv.nl/?url=${cleanUrl}&w=600&output=webp&q=75`;
            img.dataset.thumb = thumbnailUrl;

            const preload = new Image();
            preload.onload = () => {
                img.dataset.wide = (preload.naturalWidth > preload.naturalHeight * 1.15) ? '1' : '0';
                resolve();
            };
            preload.onerror = () => { img.dataset.wide = '0'; resolve(); };
            preload.src = thumbnailUrl;
        })));

        // Reordenamos para que nunca queden dos fotos horizontales seguidas
        // (no elimina el 100% de los huecos del grid, pero reduce la mayoría)
        const wideImgs = imgs.filter(img => img.dataset.wide === '1');
        const normalImgs = imgs.filter(img => img.dataset.wide !== '1');
        const ordered = [];
        let lastWasWide = false;
        while (wideImgs.length || normalImgs.length) {
            if (!lastWasWide && wideImgs.length) {
                ordered.push(wideImgs.shift());
                lastWasWide = true;
            } else if (normalImgs.length) {
                ordered.push(normalImgs.shift());
                lastWasWide = false;
            } else {
                ordered.push(wideImgs.shift());
                lastWasWide = true;
            }
        }
        ordered.forEach(img => container.appendChild(img));

        // Ya con el orden definitivo, mostramos las miniaturas (ya están en caché)
        ordered.forEach(img => {
            const highResUrl = img.getAttribute('data-highres');
            img.src = img.dataset.thumb;
            img.setAttribute('loading', 'lazy');
            img.setAttribute('decoding', 'async');
            img.classList.add('gallery-img');
            if (img.dataset.wide === '1') img.classList.add('wide');

            if (img.complete) setMasonrySpan(img);
            else img.addEventListener('load', () => setMasonrySpan(img));

            img.addEventListener('click', () => openImageModal(highResUrl));
        });
    }

    // Recalculamos los tamaños al cambiar de ancho de ventana (cambia el nº de columnas)
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            document.querySelectorAll('.gallery img.gallery-img').forEach(setMasonrySpan);
        }, 200);
    });
});

// Función para abrir la imagen en el modal
function openImageModal(highResUrl) {
    modal.classList.add('active');
    
    // Reseteamos los estilos del modal para adaptarlos a la imagen
    modalContainer.style.aspectRatio = 'auto';
    modalContainer.style.height = '100vh';
    modalContainer.style.width = '100vw';
    modalContainer.style.backgroundColor = 'transparent';
    modalContainer.style.boxShadow = 'none';
    
    // Inyectamos la imagen original (la pesada se carga solo cuando el usuario la pide)
    modalContainer.innerHTML = `
        <div class="modal-image-container">
            <img src="${highResUrl}" alt="Aitor Cavero Photography">
        </div>
    `;
}
</script>
